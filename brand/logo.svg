<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="#2563eb">
  <!-- SignSpeak AI mark: five fingers that are also a speech waveform; the holes are hand landmarks. -->
  <mask id="tips"><rect width="32" height="32" fill="#fff"/><g fill="#000">
    <circle cx="3.75" cy="16.25" r="1"/><circle cx="9.75" cy="7.25" r="1"/><circle cx="15.75" cy="4.25" r="1"/>
    <circle cx="21.75" cy="7.25" r="1"/><circle cx="27.75" cy="12.25" r="1"/></g></mask>
  <g mask="url(#tips)">
    <rect x="1.5" y="14" width="4.5" height="11" rx="2.25"/>
    <rect x="7.5" y="5" width="4.5" height="22" rx="2.25"/>
    <rect x="13.5" y="2" width="4.5" height="28" rx="2.25"/>
    <rect x="19.5" y="5" width="4.5" height="22" rx="2.25"/>
    <rect x="25.5" y="10" width="4.5" height="14" rx="2.25"/>
  </g>
</svg>
